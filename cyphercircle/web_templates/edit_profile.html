{% extends "base.html" %}
{% block title %}Edit profile · Cypher Circle{% endblock %}
{% block content %}<section class="page-heading"><div><p class="eyebrow">UC-4 · Edit profile</p><h1>Edit profile</h1><p class="lede">Keep the details that help people recognize the real you.</p></div><a class="button button-secondary" href="{{ url_for('profile_view', username=profile.username) }}">Cancel</a></section>
<section class="form-card wide-form">{% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="name">Name</label><input id="name" name="name" type="text" value="{{ profile.name }}" required><label for="username">Username <span class="label-hint">Cannot be changed</span></label><input id="username" type="text" value="@{{ profile.username }}" disabled><label for="email">Email</label><input id="email" name="email" type="email" value="{{ profile.email }}" autocomplete="email" required><label for="bio">Bio <span class="label-hint">Type - to clear</span></label><textarea id="bio" name="bio" maxlength="160" rows="4">{{ profile.bio or '' }}</textarea><label for="location">Location <span class="label-hint">Type - to clear</span></label><input id="location" name="location" type="text" value="{{ profile.location or '' }}"><button class="button" type="submit">Save changes <span aria-hidden="true">→</span></button></form></section>
{% endblock %}
